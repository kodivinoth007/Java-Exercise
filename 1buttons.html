<!DOCTYPE html>
<html>
    <head>
        <title>Buttons create Css</title>
        <style>
            /*  First example of Css buttons lessons*/
            .one{
                background-color:rgb(201, 0, 0);
                color:white;
                border:none;
                padding-left:10px;
                padding-top:10px;
                padding-bottom:10px;
                padding-right:10px;
                vertical-align:top;
                margin-right:5px;
                border-radius:5px;
                cursor:pointer;
            }
            .one:hover{
               background-color:rgb(241, 38, 38);
               transition:color 1s;
            }
            .one:active{
                background-color:rgb(105, 0, 0);
                
            }
            .two{
                background-color:white;
                color:rgb(7, 28, 214);
                border:2px;
                border-color: rgb(7, 28, 214);
                border-style:solid;
                border-width: 2px;
                height:35px;
                width:50px;
                margin-right:5px;
                border-radius:5px;
                cursor:progress;

            }
            .two:hover{

               background-color:blue;
                color:white;
                transition:background-color 1s,
                color 1s;

            }
            .two:active{
                color:blue;
                background-color:white;
                transition:background-color 1s,color 2s;

            }

            .three{
                background-color:rgb(0, 119, 231);
                height:36px;
                width:80px;
                color:rgb(237, 243, 243);
                border-radius:20px;
                border:none;
                border-width:2px;
                font-weight:bold;
                font-size:14px;
                cursor:wait;
                
            }
            .three:hover{
                background-color:green;
                transition:background-color 1s;
            }
            .Uber-button{
                background-color:black;
                color:white;
                height:35px;
                border:none;
                border-radius:1px;
                width:120px;
                margin-right:4px;
                font-weight:bold;
                font-size:12px;
                cursor:cell;
                
            }
            .Uber-button:hover{
             background-color:rgb(0, 0, 0);
             opacity:0.5;
            }
            
            .Amazon-button{
                background-color:rgb(255, 213, 0);
                height:36px;
                width:160px;
                color:black;
                border:none;
                border-radius:40px;
                margin-left:4px;
                font-weight:bold;
                cursor:alias;
            }
            .Amazon-button:hover{
                background-color: rgb(223, 186, 0);
            }
            .GitHub-button{
                background-color:rgb(46,164,79);
                color:white;
                height:36px;
                width:100px;
                border:none;
                font-weight: bold;
                border-radius:4px;
                margin-left:10px;
                cursor:move;
            }
            .GitHub-button:hover{
                box-shadow:10px 10px 10px rgba(46,164,79,0.3);
            }
            .Boot-button{
                background-color:rgb(121,82,179);
                color:white;
                border: none;
                width:120px;
                height:38px;
                font-weight:bold;
                border-radius:5px;
                margin-right:10px;
                cursor:copy;


            }
            .Boot-button:hover{
              background-color:rgb(90, 0, 224);
            
            }
            .strap-button{
                background-color:rgb(255, 255, 255);
                color:rgb(108,117,125);
                height:38px;
                width:120px;
                border-style: solid;
                border-color:rgb(108,117,125);
                border-radius:5px;
                cursor:no-drop;

            }
            .strap-button:hover{
                color:rgb(255, 255, 255);
                background-color:rgb(108,117,125);
            }
            .link-button{                          
                background-color:rgb(10,102,194);
                color:white;
                border:none;
                height:40px;
                width:212px;
                border-radius:20px;
                font-weight:bold;
                margin-right:10px;
                cursor:grab;
            }
            .link-button:hover{
                background-color:rgb(3, 50, 97);
            }
            .edin-button{
                background-color:white;
                color:rgb(10,102,194);
                height:40px;
                width:90px;
                border-color:rgb(10,102,194); 
                border-radius:20px;
                font-weight:bold;
                cursor:text;
            }
            .edin-button:hover{
                border-width: 3px;
                background-color:rgb(219, 237, 255) ;
            }

            /*Second lesson of challange exercises*/
            .back-button{
                padding-left:10px;
                padding-right:10px;
                padding-bottom:8px;
                padding-top:8px;
                margin-right:10px;
                
            }
            .next-button{
                padding-left:10px;
                padding-right:10px;
                padding-bottom:8px;
                padding-top:8px;
                margin-left:10px;

            }
            #link-numbers{
                color:blue;
                margin-right:5px;
                padding-right:5px;
            }
            .heading-pagi{
                color:blueviolet;
            }
            .heading-Stre{
                color:purple;
            }
           .Stretch-button{
            padding-right:10px;
            padding-left:10px;
            padding-top:10px;
            padding-bottom:10px;
            color:white;
            background-color:rgb(53, 255, 53);
            border:none;
            border-radius:20px;
            font-weight:bold;
            cursor: pointer;
           }
           .Stretch-button:hover{
            
            color:rgb(250, 246, 246);
            background-color:yellow;
            padding-right:20px;
            padding-left:20px;
            padding-top:20px;
            padding-bottom:20px;
            transition:2s;
           }
           .heading-click{
            color:rgb(182, 3, 33);
           }
           .shadow-button{
            background-color:blue;
            color:white;
            border:none;
            padding-left:10px;
            padding-right:10px;
            padding-bottom:10px;
            padding-top:10px;
            border-radius:20px;
            cursor:pointer;
            font-weight:bold;
           }
        .shadow-button:hover{
            background-color:blueviolet;
            color:white;
            box-shadow:10px 10px 12px blueviolet ;
            
        }

        .shadow-button:active{
        
            transform: scale(0.9);
            box-shadow: none;
          
        }
        .heading-tog{
            color:aqua;
        }
        .a-button{
                background-color: rgb(255, 0, 0);
                color:white;
                border:none;
                padding-left:10px;
                padding-right:10px;
                padding-bottom:8px;
                padding-top:8px;
                margin-left:10px;
                

        }
        .a-button:hover{
            padding-right:25px;
            padding-left:25px;
            margin-right:10px;
            transition:3s;
            border-radius:10px;
            
        }
        .b-button{
                background-color:rgb(0, 90, 126);
                color:rgb(252, 243, 243);
                border:none;
                padding-left:10px;
                padding-right:10px;
                padding-bottom:8px;
                padding-top:8px;
                margin-left:10px;


        }
        .b-button:hover{
            padding-right:25px;
            padding-left:25px;
            margin-right:10px;
            margin-left:10px;
            transition:3s;
            border-radius:10px;
            
        }
        .c-button{
                background-color:rgb(0, 51, 0);
                color:white;
                border:none;
                padding-left:10px;
                padding-right:10px;
                padding-bottom:8px;
                padding-top:8px;
                margin-left:10px;

        }
        .c-button:hover{
            padding-right:25px;
            padding-left:25px;
            margin-left:10px;
            transition:3s;
            border-radius:10px;
            
        }

        </style>
    </head>
    <body>
<!-- First lesson of buttons example-->
    <div>
        <button class="one">SUBSCRIBE</button>

        <button class="two">JOIN</button>
        <button class="three">Tweet</button>
    </div>
    <br>
    <div>
        <button class="Uber-button">Request now</button>
        <button class="Amazon-button">Add to Card</button>
        <button class="GitHub-button">Sign up</button>
    </div>
    <br>
    <div>
        <button class="Boot-button">Get started</button>
        <button class="strap-button">Download</button>
        <br>
        <br>
        <button class="link-button">Apply on company website</button>
        <button class="edin-button">Save</button>
    </div>
    <br>
    <hr>
    <!--Second lesson of challenge exercises-->
    
     
    <div>
        <h3 class="heading-pagi">4h.Pagination</h3>
        <button class="back-button">Back</button>
        <a id="link-numbers" href="">1</a>
        <a id="link-numbers" href="">2</a>
        <a id="link-numbers"href="">3</a>
        <a id="link-numbers" href="">4</a>
        <a id="link-numbers" href="">5</a>
        <button class="next-button">Next</button>
    </div>
    <br>
    <div>
        <h3 class="heading-Stre">4i.Stretch</h3>
        <button class="Stretch-button">Stretch</button>
    <br>
        <h3 class="heading-click">4j.3D Click</h3>
        <button class="shadow-button">shadow</button>
    <br>
         <h3 class="heading-tog">4k Margin and padding together</h3>
         <button class="a-button">one</button>
         <button class="b-button">two</button>
         <button class="c-button">three</button>

    </div>
         <h2>The End</h4>
<hr>
    </body>
</html>
